name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Analiza el issue #${{ github.event.issue.number }} en el repositorio ${{ github.repository }}.

            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}`.
            2. Lee `CLAUDE.md` en la raíz del repo para entender la arquitectura del proyecto (Tetris en JS vanilla, archivo único `game.js`).
            3. Revisa los labels existentes con `gh label list --repo ${{ github.repository }}` y asigna al issue los labels apropiados de esa lista con `gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "..."`. No crees labels nuevos que no existan.
            4. Edita el body del issue agregando al final (sin borrar el contenido original) una sección markdown:

               ## Diagnóstico técnico

               - **Causa probable**: ...
               - **Área/función afectada**: referencia funciones y archivos concretos de `game.js` (p.ej. `collide()`, `clearLines()`, `spawn()`) según lo que describa `CLAUDE.md`.
               - **Enfoque de solución sugerido**: descripción general de cómo abordar el fix o feature, sin escribir el código todavía.

               Usa `gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file <archivo>` para aplicar el nuevo body completo (original + diagnóstico).

          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh label list:*)"
