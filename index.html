<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">TEMA</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre modo oscuro y claro" />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section hidden" id="combo-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> hold</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div class="panel-section hidden" id="overlay-best-stats">
          <div><span class="label">MEJOR COMBO</span> <span class="value" id="best-combo-value">0</span></div>
          <div><span class="label">MÁX. LÍNEAS</span> <span class="value" id="best-lines-value">0</span></div>
        </div>

        <div class="panel-section hidden" id="overlay-leaderboard">
          <span class="label">TOP 5</span>
          <ol id="overlay-leaderboard-list" class="leaderboard-list"></ol>
          <button id="reset-records-btn" class="secondary-btn" type="button">Borrar récords</button>
        </div>

        <div class="panel-section hidden" id="name-input-section">
          <span class="label">¡Nuevo récord! Ingresa tu nombre</span>
          <input type="text" id="player-name-input" maxlength="12" placeholder="AAA" />
          <button id="save-record-btn" type="button">Guardar</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
